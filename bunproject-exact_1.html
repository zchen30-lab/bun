<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bun Project</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fbfaf8;
            overflow: hidden;
        }

        .frame {
            position: relative;
            width: 1512px;
            height: 982px;
            background-color: #fbfaf8;
            display: none;
        }

        .frame.active {
            display: block;
        }

        /* Frame 1 Elements */
        #bun1 {
            position: absolute;
            left: 439px;
            top: 280px;
            width: 634px;
            height: 634px;
            cursor: pointer;
        }

        #bun1 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 50%;
            pointer-events: none;
        }

        #text {
            position: absolute;
            left: 592px;
            top: 119px;
            width: 328px;
            height: 162px;
            font-family: 'Helvetica', sans-serif;
            font-weight: bold;
            font-size: 36px;
            line-height: 1.5;
            letter-spacing: -0.396px;
            color: #000000;
            text-align: center;
            pointer-events: none;
        }

        #eatclick {
            position: absolute;
            left: 1378px;
            top: 37px;
            width: 82px;
            height: 82px;
            cursor: pointer;
        }

        #ellipse2 {
            position: absolute;
            width: 82px;
            height: 82px;
        }

        #ellipse2 img {
            width: 100%;
            height: 100%;
        }

        #eaticon {
            position: absolute;
            left: 18px;
            top: 18px;
            width: 45px;
            height: 45px;
        }

        #eaticon img {
            width: 100%;
            height: 100%;
        }

        /* Frame 2 Elements */
        #bun3 {
            position: absolute;
            left: 439px;
            top: 280px;
            width: 634px;
            height: 634px;
        }

        #bun3 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 50%;
            pointer-events: none;
        }

        #emoji {
            position: absolute;
            left: 756px;
            top: 213px;
            font-family: 'Helvetica', sans-serif;
            font-weight: bold;
            font-size: 40px;
            line-height: 1.5;
            letter-spacing: -0.44px;
            color: #000000;
            text-align: center;
            transform: translateX(-50%);
        }

        /* 史莱姆拉伸效果 */
        .slime-stretchable {
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            user-select: none;
            cursor: grab;
        }

        .slime-stretchable:active {
            cursor: grabbing;
        }

        /* 果冻抖动动画 */
        @keyframes jelly-wobble {
            0%, 100% { transform: scale(1, 1); }
            25% { transform: scale(0.9, 1.1); }
            50% { transform: scale(1.1, 0.9); }
            75% { transform: scale(0.95, 1.05); }
        }

        .jelly-active {
            animation: jelly-wobble 0.5s ease-in-out;
        }

        /* 频率抖动动画 - 弱 */
        @keyframes vibrate-weak {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-2px, 1px) rotate(-1deg); }
            50% { transform: translate(2px, -1px) rotate(1deg); }
            75% { transform: translate(-1px, 2px) rotate(-0.5deg); }
        }

        /* 频率抖动动画 - 中等 */
        @keyframes vibrate-medium {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-5px, 3px) rotate(-2deg); }
            50% { transform: translate(5px, -3px) rotate(2deg); }
            75% { transform: translate(-3px, 5px) rotate(-1deg); }
        }

        /* 频率抖动动画 - 强 */
        @keyframes vibrate-strong {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-10px, 6px) rotate(-4deg); }
            50% { transform: translate(10px, -6px) rotate(4deg); }
            75% { transform: translate(-6px, 10px) rotate(-2deg); }
        }

        .vibrate-1 { animation: vibrate-weak 0.15s infinite; }
        .vibrate-2 { animation: vibrate-medium 0.15s infinite; }
        .vibrate-3 { animation: vibrate-strong 0.15s infinite; }

        /* bun2 在 frame2 中的样式 */
        #bun2-frame2 {
            position: absolute;
            left: 439px;
            top: 280px;
            width: 634px;
            height: 634px;
        }

        #bun2-frame2 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 50%;
            pointer-events: none;
        }

        /* 音频控制面板 */
        .audio-panel {
            position: absolute;
            top: 50px;
            left: 50px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            min-width: 300px;
        }

        .audio-panel h3 {
            margin: 0 0 15px 0;
            font-family: 'Helvetica', sans-serif;
            font-size: 18px;
        }

        .frequency-display {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin: 15px 0;
            text-align: center;
        }

        .audio-btn {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .audio-btn.start {
            background: #4ecdc4;
            color: white;
        }

        .audio-btn.start:hover {
            background: #45b8b0;
        }

        .audio-btn.stop {
            background: #ff6b6b;
            color: white;
        }

        .audio-btn.stop:hover {
            background: #ee5a52;
        }

        .status-text {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <!-- Frame 1 -->
    <div class="frame active" id="frame1">
        <div id="bun1">
            <img src="https://www.figma.com/api/mcp/asset/04dcea7d-080c-4a14-9878-aabd6e164a40" alt="">
        </div>

        <div id="text">
            <p>Touch Me!!!!!</p>
            <p>Drag ME!!!</p>
            <p>And Then EAT ME!!</p>
        </div>

        <div id="eatclick">
            <div id="ellipse2">
                <img src="https://www.figma.com/api/mcp/asset/2f526970-565d-40ea-bac8-c73120e1ba0b" alt="">
            </div>
            <div id="eaticon">
                <img src="https://www.figma.com/api/mcp/asset/f3a23ea6-b00f-45cb-9853-0191582de4dd" alt="">
            </div>
        </div>
    </div>

    <!-- Frame 2 -->
    <div class="frame" id="frame2">
        <!-- 音频控制面板 -->
        <div class="audio-panel">
            <h3>🎤 音频频率检测</h3>
            <div class="frequency-display" id="frequencyDisplay">0 Hz</div>
            <button class="audio-btn start" id="startAudioBtn">开始检测</button>
            <button class="audio-btn stop" id="stopAudioBtn" style="display:none;">停止检测</button>
            <div class="status-text" id="statusText">点击"开始检测"启动麦克风</div>
        </div>

        <div id="bun2-frame2" class="slime-stretchable">
            <img src="https://www.figma.com/api/mcp/asset/04dcea7d-080c-4a14-9878-aabd6e164a40" alt="">
        </div>

        <p id="emoji">ヽ(*＾ω＾*)ﾉ</p>
    </div>

    <script>
        const frame1 = document.getElementById('frame1');
        const frame2 = document.getElementById('frame2');
        const bun1 = document.getElementById('bun1');
        const eatButton = document.getElementById('eatclick');
        const bun2Frame2 = document.getElementById('bun2-frame2');

        // ========== Frame 切换 ==========
        function showFrame2() {
            frame1.classList.remove('active');
            frame2.classList.add('active');
            // 自动开始音频检测
            startAudioDetection();
        }

        // 只有 eatclick 可以触发跳转（移除了 bun1 的点击事件）
        eatButton.addEventListener('click', (e) => {
            e.stopPropagation();
            showFrame2();
        });

        // ========== 史莱姆拉伸效果 ==========
        function makeSlimeStretchable(element) {
            let isDragging = false;
            let startX, startY;
            let currentX = 0, currentY = 0;

            element.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - currentX;
                startY = e.clientY - currentY;
                element.style.transition = 'none';
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                currentX = e.clientX - startX;
                currentY = e.clientY - startY;

                // 根据拖拽距离计算拉伸
                const scaleX = 1 + Math.abs(currentX) / 300;
                const scaleY = 1 + Math.abs(currentY) / 300;

                // 限制最大拉伸
                const finalScaleX = Math.min(scaleX, 1.8);
                const finalScaleY = Math.min(scaleY, 1.8);

                element.style.transform = `translate(${currentX}px, ${currentY}px) scale(${finalScaleX}, ${finalScaleY})`;
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    element.style.transition = 'transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                    element.style.transform = 'translate(0, 0) scale(1, 1)';
                    currentX = 0;
                    currentY = 0;
                }
            });

            // 触摸支持
            element.addEventListener('touchstart', (e) => {
                isDragging = true;
                const touch = e.touches[0];
                startX = touch.clientX - currentX;
                startY = touch.clientY - currentY;
                element.style.transition = 'none';
                e.preventDefault();
            });

            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const touch = e.touches[0];

                currentX = touch.clientX - startX;
                currentY = touch.clientY - startY;

                const scaleX = 1 + Math.abs(currentX) / 300;
                const scaleY = 1 + Math.abs(currentY) / 300;

                const finalScaleX = Math.min(scaleX, 1.8);
                const finalScaleY = Math.min(scaleY, 1.8);

                element.style.transform = `translate(${currentX}px, ${currentY}px) scale(${finalScaleX}, ${finalScaleY})`;
            });

            document.addEventListener('touchend', () => {
                if (isDragging) {
                    isDragging = false;
                    element.style.transition = 'transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                    element.style.transform = 'translate(0, 0) scale(1, 1)';
                    currentX = 0;
                    currentY = 0;
                }
            });
        }

        // ========== 果冻抖动效果 ==========
        function addJellyWobble(element) {
            element.addEventListener('click', (e) => {
                e.stopPropagation();
                element.classList.remove('jelly-active');
                // 强制重排以重新触发动画
                void element.offsetWidth;
                element.classList.add('jelly-active');

                setTimeout(() => {
                    element.classList.remove('jelly-active');
                }, 500);
            });
        }

        // 为 bun1 添加史莱姆拉伸和果冻抖动
        bun1.classList.add('slime-stretchable');
        makeSlimeStretchable(bun1);
        addJellyWobble(bun1);

        // 为 frame2 的 bun2 添加交互
        makeSlimeStretchable(bun2Frame2);
        addJellyWobble(bun2Frame2);

        // ========== 音频频率检测 ==========
        let audioContext;
        let analyser;
        let microphone;
        let dataArray;
        let animationId;
        let isAudioActive = false;

        const startAudioBtn = document.getElementById('startAudioBtn');
        const stopAudioBtn = document.getElementById('stopAudioBtn');
        const frequencyDisplay = document.getElementById('frequencyDisplay');
        const statusText = document.getElementById('statusText');

        async function startAudioDetection() {
            if (isAudioActive) return; // 防止重复启动

            try {
                // 请求麦克风权限
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                // 创建音频上下文
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);

                analyser.fftSize = 2048;
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                microphone.connect(analyser);

                isAudioActive = true;
                startAudioBtn.style.display = 'none';
                stopAudioBtn.style.display = 'inline-block';
                statusText.textContent = '✅ 正在检测音频频率...';

                detectFrequency();

            } catch (error) {
                console.error('无法访问麦克风:', error);
                statusText.textContent = '❌ 无法访问麦克风，请允许权限';
            }
        }

        function stopAudioDetection() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            if (microphone) {
                microphone.disconnect();
            }
            if (audioContext) {
                audioContext.close();
            }

            isAudioActive = false;
            startAudioBtn.style.display = 'inline-block';
            stopAudioBtn.style.display = 'none';
            statusText.textContent = '已停止检测';
            frequencyDisplay.textContent = '0 Hz';

            // 移除抖动效果
            bun2Frame2.classList.remove('vibrate-1', 'vibrate-2', 'vibrate-3');
        }

        function detectFrequency() {
            if (!isAudioActive) return;

            analyser.getByteFrequencyData(dataArray);

            // 找到最强的频率
            let maxValue = 0;
            let maxIndex = 0;

            for (let i = 0; i < dataArray.length; i++) {
                if (dataArray[i] > maxValue) {
                    maxValue = dataArray[i];
                    maxIndex = i;
                }
            }

            // 计算频率 (Hz)
            const nyquist = audioContext.sampleRate / 2;
            const frequency = (maxIndex * nyquist) / analyser.frequencyBinCount;

            // 只在 200-1200 Hz 范围内响应
            if (frequency >= 200 && frequency <= 1200 && maxValue > 50) {
                frequencyDisplay.textContent = Math.round(frequency) + ' Hz';

                // 根据频率计算抖动强度
                // 200Hz = 弱抖动, 600Hz = 中等抖动, 1000Hz+ = 强烈抖动
                let vibrationLevel = 0;

                if (frequency >= 200 && frequency < 500) {
                    vibrationLevel = 1; // 弱
                } else if (frequency >= 500 && frequency < 900) {
                    vibrationLevel = 2; // 中
                } else if (frequency >= 900 && frequency <= 1200) {
                    vibrationLevel = 3; // 强
                }

                // 应用抖动效果
                bun2Frame2.classList.remove('vibrate-1', 'vibrate-2', 'vibrate-3');
                if (vibrationLevel > 0) {
                    bun2Frame2.classList.add(`vibrate-${vibrationLevel}`);
                    const intensityStars = '⭐'.repeat(vibrationLevel);
                    statusText.textContent = `🎵 频率: ${Math.round(frequency)} Hz - 强度: ${intensityStars}`;
                }
            } else {
                // 不在范围内，移除抖动
                bun2Frame2.classList.remove('vibrate-1', 'vibrate-2', 'vibrate-3');
                if (frequency > 0 && maxValue > 50) {
                    frequencyDisplay.textContent = Math.round(frequency) + ' Hz';
                    statusText.textContent = '请发出 200-1200 Hz 的声音';
                }
            }

            animationId = requestAnimationFrame(detectFrequency);
        }

        startAudioBtn.addEventListener('click', startAudioDetection);
        stopAudioBtn.addEventListener('click', stopAudioDetection);

        // 页面卸载时清理
        window.addEventListener('beforeunload', () => {
            if (isAudioActive) {
                stopAudioDetection();
            }
        });
    </script>
</body>
</html>
